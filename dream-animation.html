<head>

<title>ความฝันของเด็กน้อย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#03050a;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:min(100vw,calc(100vh*400/711));width:min(100vw,calc(100dvh*400/711));aspect-ratio:400/711;touch-action:manipulation;cursor:pointer;user-select:none;-webkit-user-select:none}
svg{display:block;width:100%;height:100%}
.hand{font-family:'Mali','Sarabun','Noto Sans Thai',cursive,sans-serif;font-weight:700}
.sub{font-family:'Sarabun','Noto Sans Thai',sans-serif;font-weight:800;font-size:17px;fill:#fff;stroke:rgba(0,0,0,.8);stroke-width:3.6px;paint-order:stroke;stroke-linejoin:round}
.shirt{font-family:'Arial Black','Sarabun',Impact,sans-serif;font-weight:900}
.star{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
#kidSway{transform-origin:200px 640px;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
#kidHead{transform-origin:200px 530px;animation:sway 4.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}
.hop{animation:hop .7s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.led{animation:led 2.4s steps(1) infinite}
@keyframes led{0%,92%{opacity:1}93%,100%{opacity:.2}}
</style>
</head>

<div class="stage" id="stage">

<defs>

  </linearGradient>
  <pattern id="stripes" width="26" height="10" patternUnits="userSpaceOnUse">

  <radialGradient id="tvGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#8fd6ff" stop-opacity=".5"/>
    <stop offset=".6" stop-color="#5aa9ff" stop-opacity=".14"/>
    <stop offset="1" stop-color="#5aa9ff" stop-opacity="0"/>

  <radialGradient id="floorGlowG" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#78c2ff" stop-opacity=".38"/>
    <stop offset="1" stop-color="#78c2ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx="50%" cy="48%" r="75%">
    <stop offset=".55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity=".6"/>
  </radialGradient>
  <radialGradient id="screenVig" cx="50%" cy="50%" r="70%">
    <stop offset=".6" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity=".45"/>

  <linearGradient id="reflect" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
    <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
    <rect width="4" height="1.1" fill="#000" opacity=".16"/>
  </pattern>
  <pattern id="net" width="3.2" height="3.2" patternUnits="userSpaceOnUse">
    <path d="M0 0L3.2 3.2M3.2 0L0 3.2" stroke="#fff" stroke-width=".35" opacity=".8"/>
  </pattern>
  <filter id="noise" x="0" y="0" width="100%" height="100%">
    <feTurbulence id="noiseSeed" type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="1"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="blur6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="screenClip"><rect x="90" y="180" width="220" height="140" rx="6"/></clipPath>
  <clipPath id="dreamClip"><circle cx="200" cy="250" r="118"/></clipPath>
  <linearGradient id="dreamSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#060d30"/><stop offset="1" stop-color="#1b3280"/>
  </linearGradient>
  <radialGradient id="lightG" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#fff8d6" stop-opacity=".95"/>
    <stop offset="1" stop-color="#fff8d6" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff6c8" stop-opacity=".3"/>
    <stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="grassG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1f7c3b"/><stop offset="1" stop-color="#2e9a4c"/>
  </linearGradient>
</defs>

      <line x1="207" y1="328" x2="215" y2="313" stroke="#0a4bb5" stroke-width="3.6" stroke-linecap="round"/>
      <circle cx="184.5" cy="311.5" r="2.2" fill="#c98f66"/><circle cx="215.5" cy="311.5" r="2.2" fill="#c98f66"/>
      <circle cx="200" cy="319" r="5.8" fill="#1b1411"/>
    </g>
    <text x="200" y="170" text-anchor="middle" font-family="'Sarabun','Arial',sans-serif" font-size="12" font-weight="800" fill="#fff" stroke="rgba(0,0,40,.7)" stroke-width="3" paint-order="stroke" stroke-linejoin="round" letter-spacing="2">STAMFORD BRIDGE</text>
  </g>
  <circle cx="200" cy="250" r="118" fill="none" stroke="#fff" stroke-width="5"/>
</g>

<g id="confetti" pointer-events="none"></g>
<text id="sub" class="sub" x="200" y="690" text-anchor="middle" opacity="0"></text>
<rect id="fadeRect" width="400" height="711" fill="#000" opacity="1" pointer-events="none"/>
</svg>
</div>

<script>
(() => {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const PERIOD = 24;
const shotStart = 9.0, shotEnd = 9.55;

/* ---------- ผู้เล่นบนจอทีวี ---------- */
const blueBase = [[14,70],[45,32],[45,56],[45,84],[45,108],[78,40],[78,70],[78,100],[108,45],[108,95]];
const redBase  = [[206,70],[172,30],[172,50],[172,90],[172,112],[140,44],[140,70],[140,98],[96,62],[96,78]];
const shiftB = [0,18,18,18,18,34,34,34,52,52];
const shiftR = [0,10,10,10,10,24,24,24,36,36];
function makePlayer(parent, fill, stroke) {
  const g = el('g', {}, parent);
  el('ellipse', { cx: .8, cy: 2.2, rx: 3.8, ry: 1.5, fill: 'rgba(0,0,0,.28)' }, g);
  el('circle', { r: 3.7, fill, stroke, 'stroke-width': .6 }, g);
  el('circle', { cy: -.2, r: 1.5, fill: '#f0c8a0' }, g);
  return g;
}
const blueEls = blueBase.map((_, i) => makePlayer($('blueTeam'), i === 0 ? '#f2d32c' : '#1d68ee', '#0a2a6e'));
const redEls  = redBase.map((_, i) => makePlayer($('redTeam'), i === 0 ? '#35d0c8' : '#e03a3a', '#6e1010'));

function pos(side, i, Tm) {
  const base = (side === 'b' ? blueBase : redBase)[i];
  const a = sstep(1.5, 8.8, Tm);
  const ph = i * 1.7 + (side === 'b' ? 0 : 2.1);
  const sh = (side === 'b' ? shiftB : shiftR)[i];
  let x = base[0] + sh * a + Math.sin(Tm * 1.3 + ph) * 1.5;
  let y = base[1] + Math.cos(Tm * 1.1 + ph * 1.3) * 2;
  if (side === 'b' && i === 8) { const d = sstep(7.9, 9.0, Tm); x += 30 * d; y += (66 - base[1]) * .8 * d; }
  if (side === 'r' && i === 0) { const d = sstep(shotStart + .12, shotEnd + .25, Tm); x -= 3 * d; y += 15 * d; }
  if (side === 'b' && i > 0) { const c = sstep(9.9, 11.4, Tm) * .6; x = lerp(x, 182 + (i % 4) * 5, c); y = lerp(y, 52 + ((i * 7) % 5) * 7, c); }
  return [x, y];
}
const passes = [
  { f: 2, t: 6, a: 2.4, b: 3.1 },
  { f: 6, t: 7, a: 4.0, b: 4.7 },
  { f: 7, t: 9, a: 5.6, b: 6.3 },
  { f: 9, t: 8, a: 7.0, b: 7.8 }
];
const carry = (h, Tm) => { const p = pos('b', h, Tm); return [p[0] + 4.6, p[1] + Math.sin(Tm * 9) * .8 + .4]; };
function ballAt(Tm) {
  let holder = 2;
  for (const p of passes) {
    if (Tm < p.a) break;
    if (Tm <= p.b) {
      const kk = (Tm - p.a) / (p.b - p.a), k = .5 - .5 * Math.cos(Math.PI * kk);
      const A = carry(p.f, Tm), B = carry(p.t, Tm);
      return [lerp(A[0], B[0], k), lerp(A[1], B[1], k)];
    }
    holder = p.t;
  }
  if (Tm < shotStart) return carry(holder, Tm);
  if (Tm < shotEnd) { const k = (Tm - shotStart) / (shotEnd - shotStart), S = carry(8, shotStart); return [lerp(S[0], 216, k), lerp(S[1], 64, k)]; }
  const r = Tm - shotEnd;
  return [216 + Math.sin(r * 22) * Math.exp(-r * 4) * 1.2, 64 + Math.cos(r * 18) * Math.exp(-r * 4) * .8];
}

/* ---------- ฝูงชนในฝัน ---------- */
const crowdG = $('crowd'), cr = rng(11), dots = [];
const cols = ['#2f7bf0', '#ffffff', '#0a4bb5', '#7fb8ff', '#ffffff', '#ffd54a'];
for (let r = 0; r < 8; r++) {
  for (let x = 84; x <= 318; x += 6.2) {
    const ytop = 232 - 18 * (1 - Math.pow((x - 200) / 130, 2));
    const y = ytop + 7 + r * 7.4 + (cr() - .5) * 1.5;
    if (y > 297) continue;
    const c = el('circle', { cx: (x + (cr() - .5) * 1.5).toFixed(1), cy: y.toFixed(1), r: (1.5 + cr() * .4).toFixed(2), fill: cols[Math.floor(cr() * cols.length)] }, crowdG);
    dots.push({ c, x });
  }
}

/* ---------- กระดาษคอนเฟตติ ---------- */
const confG = $('confetti'), cc = rng(7), conf = [];
const confCols = ['#2f7bf0', '#ffffff', '#ffd54a', '#7fd0ff', '#ff6b6b'];
for (let i = 0; i < 48; i++) {
  const r = el('rect', { width: (5 + cc() * 4).toFixed(1), height: (3 + cc() * 3).toFixed(1), fill: confCols[i % confCols.length], opacity: 0 }, confG);
  conf.push({ r, vx: (cc() - .5) * 200, vy: -(70 + cc() * 150), x0: 150 + cc() * 100, y0: 175, rot: cc() * 360, vr: (cc() - .5) * 720, delay: cc() * .25, ph: cc() * 6 });
}

/* ---------- ซับไตเติล ---------- */
const subs = [
  { a: 0.8,  b: 5.0,  t: 'เด็กคนหนึ่ง… กับทีมสีน้ำเงินที่เขารัก' },
  { a: 5.2,  b: 9.2,  t: 'ทุกนัด เขาไม่เคยพลาดดูสักครั้ง' },
  { a: 9.7,  b: 13.0, t: 'ทุกครั้งที่ลูกบอลเข้าตาข่าย… ใจเขาพองโต' },
  { a: 13.5, b: 19.2, t: 'และเขาฝันว่า สักวันจะได้ไปที่นั่นจริงๆ' },
  { a: 20.2, b: 23.2, t: 'แต่ฝันนี้… ไม่ได้มาง่ายๆ' }
];
let curSub = -1;

/* ---------- เด็ก ---------- */
function jumpY(T) {
  const dt = T - 9.75;
  if (dt < 0 || dt > 3.6) return 0;
  const env = 1 - sstep(2.4, 3.6, dt);
  return -Math.abs(Math.sin(dt * Math.PI * 1.7)) * 38 * env - 6 * sstep(0, .2, dt) * env;
}
function armAngle(T) {
  const rest = 12, tense = 100, cheer = 160;
  let a = rest + (tense - rest) * sstep(8.0, 8.8, T) + (cheer - tense) * sstep(9.55, 9.85, T) - (cheer - rest) * sstep(13.0, 14.2, T);
  const w = sstep(9.85, 10.2, T) * (1 - sstep(12.4, 13.0, T));
  return a + Math.sin(T * 13) * 11 * w;
}

/* ---------- องค์ประกอบ ---------- */
const cam = $('cam'), ballEl = $('ball'), trailEl = $('trail'), netRect = $('netRect');
const scoreTxt = $('scoreTxt'), clockTxt = $('clockTxt'), goalTxt = $('goalTxt'), flash = $('flash');
const tvStatic = $('tvStatic'), noiseSeed = $('noiseSeed');
const wallGlow = $('wallGlow'), floorGlow = $('floorGlow');
const kid = $('kid'), kidShadow = $('kidShadow'), armL = $('armL'), armR = $('armR');
const dream = $('dream'), trs = Array.from(document.querySelectorAll('.tr'));
const dim = $('dim'), subEl = $('sub'), fadeRect = $('fadeRect');
const trail = [];
let lastScore = '', lastClock = '';

function render(T) {
  /* เวลาในจอทีวี: ช่วงท้ายมีสัญญาณซ่า แล้วเล่นซ้ำจากต้น */
  let Tm = T, stat = false;
  if (T >= 20.6 && T < 21.6) { stat = true; Tm = 0; } else if (T >= 21.6) { Tm = T - 21.6; }
  tvStatic.setAttribute('display', stat ? 'inline' : 'none');
  if (stat) noiseSeed.setAttribute('seed', String(Math.floor(T * 40) % 97));

  const zoom = 1 + .38 * sstep(9.5, 10.6, Tm) * (1 - sstep(12.8, 13.8, Tm));
  cam.setAttribute('transform', `translate(190 68) scale(${zoom.toFixed(3)}) translate(-190 -68)`);

  for (let i = 0; i < 10; i++) {
    const b = pos('b', i, Tm), r = pos('r', i, Tm);
    blueEls[i].setAttribute('transform', `translate(${b[0].toFixed(2)} ${b[1].toFixed(2)})`);
    redEls[i].setAttribute('transform', `translate(${r[0].toFixed(2)} ${r[1].toFixed(2)})`);
  }
  const bp = ballAt(Tm);
  ballEl.setAttribute('transform', `translate(${bp[0].toFixed(2)} ${bp[1].toFixed(2)})`);
  if (Tm < .05 || Tm > 9.6) trail.length = 0; else { trail.push(bp[0].toFixed(1) + ',' + bp[1].toFixed(1)); if (trail.length > 7) trail.shift(); }
  trailEl.setAttribute('points', trail.join(' '));

  const gt = Tm - shotEnd;
  netRect.setAttribute('transform', gt > 0 ? `translate(${(Math.sin(gt * 25) * Math.exp(-gt * 5) * 2).toFixed(2)} 0)` : '');
  const sc = Tm >= shotEnd ? '1 - 0' : '0 - 0';
  if (sc !== lastScore) { scoreTxt.textContent = sc; lastScore = sc; }
  const secs = 89 * 60 + 41 + Math.floor(Tm), ck = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
  if (ck !== lastClock) { clockTxt.textContent = ck; lastClock = ck; }

  if (gt > 0 && gt < 3.4) {
    const s = .2 + .8 * easeOutBack(clamp(gt / .45));
    goalTxt.setAttribute('transform', `translate(110 70) scale(${s.toFixed(3)})`);
    goalTxt.setAttribute('opacity', (1 - sstep(2.7, 3.3, gt)).toFixed(3));
  } else goalTxt.setAttribute('opacity', 0);
  flash.setAttribute('opacity', gt > 0 ? Math.max(0, .85 - gt * 2.2).toFixed(3) : 0);

  /* แสงห้อง */
  const dreamK = sstep(13.2, 14, T) * (1 - sstep(19.4, 20.2, T));
  let g = .6 + .05 * Math.sin(T * 21) + .04 * Math.sin(T * 6.1);
  const g2 = T - shotEnd; if (g2 > 0) g += .45 * Math.max(0, 1 - g2 * 1.1);
  g *= 1 - .35 * dreamK; if (stat) g *= 1.2;
  wallGlow.setAttribute('opacity', clamp(g).toFixed(3));
  floorGlow.setAttribute('opacity', clamp(g).toFixed(3));

  /* เด็ก */
  const lean = sstep(4.5, 9.0, T) * (1 - sstep(9.5, 9.8, T));
  const jy = jumpY(T);
  kid.setAttribute('transform', `translate(0 ${(jy - 5 * lean).toFixed(2)})`);
  kidShadow.setAttribute('rx', (108 * (1 + jy * .006)).toFixed(1));
  kidShadow.setAttribute('opacity', (.4 + jy * .004).toFixed(3));
  const aa = armAngle(T);
  armL.setAttribute('transform', `rotate(${aa.toFixed(2)} 159 556)`);
  armR.setAttribute('transform', `rotate(${(-aa).toFixed(2)} 241 556)`);

  /* ภาพฝัน */
  let sc2 = 0, op = 0;
  if (T >= 13.55 && T < 19.4) { sc2 = .12 + .88 * easeOutBack(clamp((T - 13.55) / .75)); op = clamp((T - 13.55) / .25); }
  else if (T >= 19.4 && T < 19.8) { const k = (T - 19.4) / .4; sc2 = 1 + .18 * k; op = 1 - k; }
  if (op > .01) {
    dream.setAttribute('display', 'inline');
    dream.setAttribute('opacity', op.toFixed(3));
    dream.setAttribute('transform', `translate(200 ${(250 + Math.sin(T * 2) * 2).toFixed(2)}) scale(${sc2.toFixed(3)}) translate(-200 -250)`);
    for (const d of dots) d.c.setAttribute('opacity', (.5 + .5 * Math.max(0, Math.sin(d.x * .05 - T * 4))).toFixed(2));
  } else dream.setAttribute('display', 'none');
  const starts = [13.0, 13.2, 13.4], cxy = [[203, 478], [212, 452], [222, 424]];
  trs.forEach((c, i) => {
    const k = sstep(starts[i], starts[i] + .2, T), o = k * (1 - sstep(19.2, 19.5, T)), p = cxy[i], s = .3 + .7 * k;
    c.setAttribute('opacity', o.toFixed(3));
    c.setAttribute('transform', `translate(${p[0]} ${p[1]}) scale(${s.toFixed(3)}) translate(${-p[0]} ${-p[1]})`);
  });
  dim.setAttribute('opacity', (.35 * dreamK).toFixed(3));

  /* คอนเฟตติ */
  const dt0 = T - 9.6;
  conf.forEach((c, i) => {
    const dt = dt0 - c.delay;
    if (dt < 0 || dt > 4) { c.r.setAttribute('opacity', 0); return; }
    const x = c.x0 + c.vx * dt + Math.sin(dt * 6 + c.ph) * 8;
    const y = c.y0 + c.vy * dt + 60 * dt * dt;
    c.r.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(c.rot + c.vr * dt).toFixed(0)})`);
    c.r.setAttribute('opacity', (1 - sstep(2.8, 4, dt)).toFixed(2));
  });

  /* ซับไตเติล */
  let idx = -1;
  for (let i = 0; i < subs.length; i++) if (T >= subs[i].a && T < subs[i].b) { idx = i; break; }
  if (idx !== curSub) { curSub = idx; subEl.textContent = idx >= 0 ? subs[idx].t : ''; }
  if (idx >= 0) { const s = subs[idx]; subEl.setAttribute('opacity', Math.min(sstep(s.a, s.a + .35, T), 1 - sstep(s.b - .35, s.b, T)).toFixed(3)); }
  else subEl.setAttribute('opacity', 0);

  fadeRect.setAttribute('opacity', clamp(1 - sstep(0, 1, T) + sstep(23, 24, T)).toFixed(3));
}

/* ---------- วนลูป ---------- */
const fixed = new URLSearchParams(location.search).get('t');
let t0 = performance.now();
function frame(now) {
  render(((now - t0) / 1000) % PERIOD);
  requestAnimationFrame(frame);
}
if (fixed !== null) render(parseFloat(fixed));
else {
  requestAnimationFrame(frame);
  $('stage').addEventListener('pointerdown', () => { t0 = performance.now(); });
}
})();
</script>
</body>
